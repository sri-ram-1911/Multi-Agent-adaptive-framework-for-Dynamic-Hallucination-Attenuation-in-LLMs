name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch + deps)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check app scripts tests
      - name: Type check
        run: mypy app || true
      - name: Test (offline / mock provider)
        env:
          MAAHAF_LLM__PROVIDER: mock
          MAAHAF_OTEL_ENABLED: "false"
        run: pytest -q --junitxml=pytest.xml
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --strict --ignore-vuln GHSA-none || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm audit --audit-level=high || true
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t maahaf-api:ci ./backend
      - name: Trivy scan (API image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: maahaf-api:ci
          severity: HIGH,CRITICAL
          exit-code: "0"   # set to "1" to fail the build on findings
