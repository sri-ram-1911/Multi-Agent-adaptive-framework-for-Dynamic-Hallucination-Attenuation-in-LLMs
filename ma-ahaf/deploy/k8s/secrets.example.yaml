# DO NOT COMMIT REAL VALUES. In production, generate this from an external secret
# manager (Vault Agent Injector, External Secrets Operator, AWS/GCP secret CSI).
# This file is only a shape reference.
apiVersion: v1
kind: Secret
metadata:
  name: ma-ahaf-secrets
  namespace: ma-ahaf
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-REPLACE"
  MAAHAF_JWT_SECRET: "REPLACE-with-64-hex-chars"
  MAAHAF_DATABASE_URL: "postgresql+psycopg://maahaf:REPLACE@postgres:5432/maahaf"
  MAAHAF_REDIS_URL: "redis://redis:6379/0"
---
