# Reference only. In production prefer a managed Postgres (RDS/Cloud SQL) with
# the `vector` extension enabled, and point MAAHAF_DATABASE_URL at it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ma-ahaf
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: maahaf }
            - { name: POSTGRES_DB, value: maahaf }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ma-ahaf-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "maahaf"] }
            initialDelaySeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: ma-ahaf }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: ma-ahaf }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: ma-ahaf }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
