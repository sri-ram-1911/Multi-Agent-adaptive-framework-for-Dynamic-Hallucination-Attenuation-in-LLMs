apiVersion: apps/v1
kind: Deployment
metadata: { name: maahaf-frontend, namespace: ma-ahaf }
spec:
  replicas: 2
  selector: { matchLabels: { app: maahaf-frontend } }
  template:
    metadata: { labels: { app: maahaf-frontend } }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/ma-ahaf-frontend:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: maahaf-frontend, namespace: ma-ahaf }
spec:
  selector: { app: maahaf-frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maahaf
  namespace: ma-ahaf
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/limit-rpm: "600"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["maahaf.example.com"]
      secretName: maahaf-tls
  rules:
    - host: maahaf.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: { service: { name: maahaf-api, port: { number: 80 } } }
          - path: /health
            pathType: Exact
            backend: { service: { name: maahaf-api, port: { number: 80 } } }
          - path: /metrics
            pathType: Exact
            backend: { service: { name: maahaf-api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: maahaf-frontend, port: { number: 80 } } }
---
# Restrict egress: the API only needs Postgres, Redis, the OTel collector, and the
# OpenAI/HF endpoints. Everything else is denied (proposal §18 "prevent
# unauthorized external retrieval").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: maahaf-api-egress, namespace: ma-ahaf }
spec:
  podSelector: { matchLabels: { app: maahaf-api } }
  policyTypes: ["Egress"]
  egress:
    - to: [{ podSelector: { matchLabels: { app: postgres } } }]
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
    - to: [{ namespaceSelector: { matchLabels: { name: observability } } }]
    - ports: [{ port: 443, protocol: TCP }]   # OpenAI / HuggingFace over HTTPS
    - ports: [{ port: 53, protocol: UDP }]     # DNS
