[project]
name = "ma-ahaf"
version = "0.1.0"
description = "Multi-Agent Adaptive Hallucination Attenuation Framework"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "openai>=1.35",
  "tenacity>=8.4",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "structlog>=24.1",
  "orjson>=3.10",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "networkx>=3.3",
  "langgraph>=0.1.5",
  "langchain-core>=0.2",
  "sentence-transformers>=3.0,<4",
  "transformers>=4.44,<5",
  "huggingface-hub>=0.24,<1.0",
  "sentencepiece>=0.2",
  "torch>=2.2",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "rank-bm25>=0.2.2",
  "sacrebleu>=2.4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-redis"]

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
