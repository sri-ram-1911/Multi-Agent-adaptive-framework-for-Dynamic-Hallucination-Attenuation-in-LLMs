name: ma-ahaf

x-api-env: &api-env
  MAAHAF_DATABASE_URL: postgresql+psycopg://maahaf:maahaf@db:5432/maahaf
  MAAHAF_REDIS_URL: redis://redis:6379/0
  HF_HOME: /data/models
  MAAHAF_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: maahaf
      POSTGRES_PASSWORD: maahaf
      POSTGRES_DB: maahaf
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maahaf"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      <<: *api-env
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./data:/data
      - hfcache:/data/models
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [api]

  # ---- observability profile ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    profiles: ["obs"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "8889:8889"]

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["obs"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  hfcache:
